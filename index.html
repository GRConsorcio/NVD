<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NVD CARD</title>
<meta name="description" content="Clube de descontos em restaurantes e empresas parceiras.">
<meta name="theme-color" content="#0a0f1f">
<link rel="preconnect" href="https://defwtvwmxntoliuwzjnf.supabase.co" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// tema definido antes do primeiro paint pra tela não piscar na cor errada
(function(){try{var t=localStorage.getItem('nvd.tema');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f3f5fb':'#0a0f1f'}catch(e){document.documentElement.dataset.theme='dark'}})();
</script>
<style>
:root{
  --bg:#0a0f1f;--s1:#111832;--s2:#182043;--s3:#212b56;
  --text:#eef1fb;--muted:#a3abc8;--muted2:#737c9e;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --gold:#e9b95b;--gold2:#f7d68e;--goldtext:#e9b95b;--on-gold:#1b1300;
  --green:#2fd08a;--red:#ff6473;--amber:#ffb84d;--blue:#6ea8ff;
  --shadow:0 10px 30px rgba(0,0,0,.35);--radius:16px;--nav-h:62px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5fb;--s1:#ffffff;--s2:#eef1f9;--s3:#e2e7f4;
  --text:#141a33;--muted:#535d7c;--muted2:#7f88a6;
  --border:rgba(20,26,51,.10);--border2:rgba(20,26,51,.18);
  --gold:#c48a10;--gold2:#e0a52b;--goldtext:#94650a;
  --green:#0c9a5e;--red:#d63a4b;--amber:#a86300;--blue:#2c6fdc;
  --shadow:0 8px 24px rgba(20,26,51,.10);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--goldtext)}
h1,h2,h3{line-height:1.2}
small{color:var(--muted);font-size:.8125rem}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== estrutura ===== */
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
body[data-role=admin] .app{max-width:1080px;padding-bottom:48px}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--on-gold);font-weight:900;font-size:.95rem}
.ib{background:var(--s2);color:var(--text);border:1px solid var(--border);width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;flex:none}
.ib:hover{border-color:var(--border2)}
.ib.fav{width:34px;height:34px;cursor:pointer}
.ib.fav .ic{transition:transform .15s}
.ib.fav.on{color:var(--red);border-color:rgba(255,100,115,.35);background:rgba(255,100,115,.1)}
.ib.fav.on .ic{fill:currentColor}
.ib.fav:active .ic{transform:scale(.85)}
.view{padding:16px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:1.15rem;margin-bottom:4px}
.card h3{font-size:.95rem;margin-bottom:10px}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.head h2{font-size:1.2rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s1);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;min-width:0;padding:0 2px;background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted2)}
.tab.on{color:var(--goldtext)}
.atabs{position:relative;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;-webkit-user-select:none;user-select:none}
/* menu com muitas abas: setas nas pontas (só com mouse) e um esmaecido mostrando que há mais pra rolar */
.atabs-wrap{position:relative}
.atabs-wrap::before,.atabs-wrap::after{content:"";position:absolute;top:0;bottom:0;width:44px;pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.atabs-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.atabs-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.atabs-wrap.tem-esq::before,.atabs-wrap.tem-dir::after{opacity:1}
.atabs-seta{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;background:var(--s1);color:var(--text);border:1px solid var(--border2);box-shadow:var(--shadow);display:none;place-items:center;cursor:pointer}
.atabs-seta:hover{border-color:var(--gold)}
.atabs-seta.esq{left:6px}
.atabs-seta.esq .ic{transform:scaleX(-1)}
.atabs-seta.dir{right:6px}
@media(pointer:fine){.atabs-seta:not([hidden]){display:grid}}
.atabs::-webkit-scrollbar{display:none}
.atab{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:.88rem}
.atab.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.atab .n{background:var(--red);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 7px;font-weight:800}

/* ===== listas ===== */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);border:1px solid var(--border);border-radius:14px;text-align:left;width:100%}
button.row{cursor:pointer}
button.row:hover{border-color:var(--border2)}
.row b{display:block;font-weight:700;overflow-wrap:anywhere}
.row small{display:block;overflow-wrap:anywhere}
.row .end{margin-left:auto;text-align:right;flex:none}
.logo{width:46px;height:46px;border-radius:13px;background:var(--s3);color:var(--goldtext);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:rgba(233,185,91,.14);color:var(--goldtext);font-size:.72rem;font-weight:800}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;-webkit-user-select:none;user-select:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:7px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--border);color:var(--muted);font-size:.82rem;font-weight:600}
.fchip.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.seg2{display:flex;gap:6px;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.86rem;padding:9px 0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px}
.seg2 button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold)}
.seg2 button .ic{width:16px;height:16px}
#pmapa{height:52vh;min-height:280px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--s2)}
.nvd-pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid var(--on-gold)}
.nvd-pin span{transform:rotate(45deg);font-size:17px;line-height:1;color:var(--on-gold)}
.nvd-pin.me{background:linear-gradient(135deg,var(--blue),#3d7fe0);border-color:#fff}
.leaflet-popup-content-wrapper{background:var(--s1) !important;color:var(--text) !important;border-radius:14px !important}
.leaflet-popup-tip{background:var(--s1) !important}
.leaflet-popup-content{margin:12px 14px;font-family:inherit}
.leaflet-container{font-family:inherit;background:var(--s2)}
.dist-chip{background:rgba(110,168,255,.16);color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.pill.ok{background:rgba(47,208,138,.16);color:var(--green)}
.pill.bad{background:rgba(255,100,115,.16);color:var(--red)}
.pill.warn{background:rgba(255,184,77,.18);color:var(--amber)}
.pill.info{background:rgba(110,168,255,.16);color:var(--blue)}
.pill.mut{background:var(--s3);color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .ic{width:34px;height:34px;margin-bottom:10px;color:var(--muted2)}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:.88rem;width:100%;text-align:left;border:1px solid transparent}
.banner.warn{background:rgba(255,184,77,.13);color:var(--amber);border-color:rgba(255,184,77,.3)}
.banner.info{background:rgba(110,168,255,.12);color:var(--blue);border-color:rgba(110,168,255,.3)}
.banner.bad{background:rgba(255,100,115,.12);color:var(--red);border-color:rgba(255,100,115,.3)}
.banner.ok{background:rgba(47,208,138,.12);color:var(--green);border-color:rgba(47,208,138,.3)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi small{display:block}
.kpi b{display:block;font-size:1.6rem;font-weight:800;margin-top:2px}
.kpi.hot b{color:var(--amber)}
/* esqueleto de carregamento leve: só opacidade (não repinta o gradiente a cada quadro, que pesa em celular simples) */
.skl{height:180px;border-radius:var(--radius);background:var(--s2);animation:skl 1.4s ease-in-out infinite}
@keyframes skl{50%{opacity:.45}}
#netbar{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1240;background:var(--amber);color:#1b1300;font-size:.78rem;font-weight:800;padding:5px 14px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap}
#updbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:1250;max-width:496px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--s3);color:var(--text);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow)}
#updbar span{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== formulários e botões ===== */
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.field small{display:block;margin-top:5px}
.field input,.field select,.field textarea{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text)}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,185,91,.2)}
.field.chk{display:flex;gap:10px;align-items:flex-start}
.field.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--gold)}
.field.chk label{margin:0;font-weight:500;color:var(--muted);font-size:.82rem}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;text-align:center}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--s2);color:var(--text);border:1px solid var(--border2)}
.btn.danger{background:rgba(255,100,115,.14);color:var(--red);border:1px solid rgba(255,100,115,.35)}
.btn.ok{background:linear-gradient(135deg,#46e2a0,var(--green));color:#04150d}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.82rem;border-radius:11px}
/* cresce pra ocupar a sobra, mas nunca encolhe abaixo do texto: com vários botões na linha eles quebram em vez de vazar */
.btn.fit{flex:1 0 auto}
.btn.big{min-height:64px;font-size:1.05rem;border-radius:18px}
.btn.block{display:flex;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{background:none;border:0;border-radius:11px;padding:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted2);font-size:.78rem;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.kv{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.kv span{color:var(--muted);font-size:.82rem;flex:none}
.kv b{margin-left:auto;text-align:right;overflow-wrap:anywhere}
.steps{padding-left:20px;color:var(--muted);font-size:.9rem}
.steps li{margin-bottom:6px}

/* ===== carteirinha ===== */
.wallet{position:relative;border-radius:24px;padding:20px 20px 16px;color:#f2f4ff;background:linear-gradient(135deg,#1d2b63 0%,#0c1232 58%,#2c2054 100%);border:1px solid rgba(233,185,91,.38);box-shadow:0 18px 40px rgba(6,10,30,.45);overflow:hidden;margin-bottom:14px}
.wallet::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(247,214,142,.30),transparent);pointer-events:none}
.wallet.off{filter:saturate(.5)}
.w-top{display:flex;align-items:center;justify-content:space-between;position:relative}
.w-brand{font-weight:900;letter-spacing:.24em;color:#f7d68e;font-size:.9rem}
.w-name{font-size:1.25rem;font-weight:800;margin-top:18px;position:relative;overflow-wrap:anywhere}
.w-code{margin-top:6px;display:flex;flex-direction:column;position:relative}
.w-code small{color:#9aa6d6;letter-spacing:.16em;font-size:.65rem}
.w-code b{font-size:1.05rem;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.qr-box{margin:16px auto 10px;width:min(64vw,236px);background:#fff;border-radius:18px;padding:10px;position:relative}
.qr-box svg{display:block;width:100%;height:auto}
.qr-off{color:#0c1232;font-size:.8rem;text-align:center;padding:36px 8px}
.pin-row{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:6px;position:relative}
.pin-row span{color:#9aa6d6;font-size:.7rem;letter-spacing:.16em}
.pin-row b{font-size:1.55rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.timer{height:5px;border-radius:99px;background:rgba(255,255,255,.14);margin:12px auto 0;max-width:236px;overflow:hidden;position:relative}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e9b95b,#f7d68e);border-radius:99px;transform-origin:left;transition:transform 1s linear}
.w-hint{text-align:center;color:#b6bfe6;font-size:.78rem;margin-top:10px;position:relative}
.w-foot{margin-top:14px;color:#b6bfe6;font-size:.8rem;text-align:center;position:relative}
.lock{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 8px 8px;position:relative}
.lock .ic{width:34px;height:34px;color:#f7d68e}
.lock p{color:#b6bfe6;font-size:.88rem;margin-bottom:8px}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--s2);border:1px solid var(--border2);margin-bottom:10px}
.plan:hover{border-color:var(--gold)}
.plan .pp{margin-left:auto;text-align:right}
.plan .pp strong{font-size:1.15rem;display:block}
.pay-amt{text-align:center;padding:8px 0 14px}
.pay-amt strong{font-size:2rem;display:block}

/* ===== comprovante do Pix ===== */
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.stepn{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.stepn i{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.8rem;flex:none}
.stepn b{font-size:.98rem}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 14px;border:2px dashed var(--border2);border-radius:16px;background:var(--s2);color:var(--muted);text-align:center;font-size:.9rem}
.drop:hover,.drop:focus-visible{border-color:var(--gold)}
.drop .ic{width:28px;height:28px;color:var(--goldtext)}
.drop b{color:var(--text);font-size:1rem}
.filebox{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border2);border-radius:14px;background:var(--s2)}
.filebox .th{width:56px;height:56px;border-radius:10px;background:var(--s3);color:var(--goldtext);display:grid;place-items:center;overflow:hidden;flex:none}
.filebox .th img{width:100%;height:100%;object-fit:cover}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.viewer img{width:100%;max-height:72vh;object-fit:contain;border-radius:12px;display:block;background:var(--s2)}
.viewer iframe.pdf{width:100%;height:72vh;min-height:360px;border:1px solid var(--border2);border-radius:12px;background:#fff}
/* fila de conferência: lista + visualizador lado a lado no computador; no celular o visualizador abre numa janela */
.split{display:grid;gap:16px}
.pane{display:none;background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
@media(min-width:900px){
  .split{grid-template-columns:minmax(300px,380px) 1fr;align-items:start}
  .pane{display:block;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
}
.row.sel{border-color:var(--gold);background:rgba(233,185,91,.08)}

/* ===== resumo de preço e aviso ao cliente ===== */
.resumo{margin-top:6px}
.rs-ben{padding:10px 0 12px;border-bottom:1px solid var(--border)}
.rs-ben b{display:block;font-size:1.05rem}
.rs-pagar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 2px}
.rs-pagar small{font-size:.95rem;font-weight:700;color:var(--muted)}
.rs-pagar strong{font-size:2rem;letter-spacing:-.02em}
.calc{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--border2)}
.calc .rs-pagar{padding:6px 0 0}
.calc .rs-pagar strong{font-size:1.6rem}
.calc.erro{border-color:var(--red);color:var(--red);font-size:.9rem}
.aviso-bg{position:fixed;inset:0;z-index:1210;background:rgba(3,6,18,.74);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.aviso{background:var(--s1);border:2px solid var(--green);border-radius:24px;padding:22px 20px;width:100%;max-width:420px;max-height:92vh;max-height:92dvh;overflow:auto}
.aviso.aguarde{border-color:var(--gold);text-align:center}
.aviso h2{margin:6px 0 2px;font-size:1.3rem}
.aviso>.res-i{margin:0 auto 10px;width:64px;height:64px}
.aviso.res.ok{text-align:left}
.aviso.res.ok>.res-i,.aviso.res.ok>h2,.aviso.res.ok>.muted{text-align:center;margin-left:auto;margin-right:auto}

/* ===== resultado da validação (parceiro) ===== */
.res{border-width:2px}
.res.ok{border-color:var(--green)}
.res.bad{border-color:var(--red)}
.res-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.res-i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.res-i .ic{width:28px;height:28px;stroke-width:2.6}
.res.ok .res-i{background:rgba(47,208,138,.18);color:var(--green)}
.res.bad .res-i{background:rgba(255,100,115,.18);color:var(--red)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border2);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--s2)}
.opt input{margin-top:3px;width:20px;height:20px;accent-color:var(--gold);flex:none}
.opt.off{opacity:.5;cursor:default}
.opt:has(input:checked){border-color:var(--gold);background:rgba(233,185,91,.1)}

/* ===== sheet / toast / scanner ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,18,.62);display:flex;align-items:flex-end;justify-content:center;z-index:1200;animation:fade .15s}
.sheet{background:var(--s1);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;border:1px solid var(--border2);animation:up .2s ease-out}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-h b{flex:1;font-size:1.05rem}
.sheet-b{overflow:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--s3);color:var(--text);border:1px solid var(--border2);padding:11px 16px;border-radius:14px;font-size:.88rem;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1230;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.erro{background:#3a1520;color:#ffb3bc;border-color:rgba(255,100,115,.5)}
#toast.ok{background:#0f2e22;color:#9df0c8;border-color:rgba(47,208,138,.5)}
.scan{position:fixed;inset:0;background:#000;z-index:1220;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;min-height:0;object-fit:cover}
.scan .frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.scan .frame i{width:min(68vw,320px);aspect-ratio:1;border:3px solid #f7d68e;border-radius:26px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58)}
.scan .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px;color:#fff}
.scan .msg{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:600}

/* ===== login ===== */
.auth{max-width:420px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px 40px}
.auth-brand{text-align:center;margin-bottom:26px}
.auth-brand .mark{width:64px;height:64px;border-radius:20px;font-size:1.7rem;margin:0 auto 14px}
.auth-brand h1{font-size:1.7rem;letter-spacing:.14em}
.auth-brand p{color:var(--muted);margin-top:8px;font-size:.95rem}
.err{color:var(--red);font-size:.88rem;margin-top:12px;min-height:1.2em;text-align:center}
.auth .stack{margin-top:0}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   NVD CARD — app único (cliente, parceiro e admin).
   Backend: schema isolado "nvd" no Supabase Portal Colab, acessado só por RPCs public.nvd_*.
   Login próprio (não usa Supabase Auth): o navegador nunca recebe JWT do Portal.
   ===================================================================== */
const SB_URL='https://defwtvwmxntoliuwzjnf.supabase.co';
const SB_KEY='sb_publishable_QukddDQPhm3R3XaUlxIY6w_7qleuNL8';
const VERSAO='1.3.1';
const TZ='America/Sao_Paulo';

/* ---------- utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
// todo texto vindo do banco passa por aqui antes de virar HTML (nome de cliente é digitado por qualquer pessoa)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=i=>i?new Date(i).toLocaleDateString('pt-BR',{timeZone:TZ}):'—';
const dth=i=>i?new Date(i).toLocaleString('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ha=i=>{const s=(Date.now()-new Date(i))/1000;if(s<60)return 'agora';if(s<3600)return `há ${Math.floor(s/60)} min`;if(s<86400)return `há ${Math.floor(s/3600)} h`;return `há ${Math.floor(s/86400)} d`};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase();
const fmtCod=c=>c?String(c).slice(0,4)+'-'+String(c).slice(4):'';
const seguraUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'')?u:'';
const periodoTxt=d=>d===30?'por mês':d===365?'por ano':d===90?'por trimestre':d===180?'por semestre':`por ${d} dias`;
const LIMITE_TXT={dia:'por dia',semana:'por semana',mes:'por mês',sempre:'no total'};
const TIPOS_BENEF=[['2x1','2 por 1'],['percentual','Desconto em %'],['valor_fixo','Desconto em R$'],['brinde','Brinde'],['outro','Outro']];
function resumoBenef(b){
  const v=b.valor!=null?Number(b.valor):null,f=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2});
  if(b.tipo==='2x1')return '2x1';
  if(b.tipo==='percentual'&&v!=null)return f(v)+'% OFF';
  if(b.tipo==='valor_fixo'&&v!=null)return 'R$ '+f(v)+' OFF';
  if(b.tipo==='brinde')return 'Brinde';
  return b.titulo.length>22?b.titulo.slice(0,21)+'…':b.titulo;
}
// o navegador bloqueia vibrate antes do primeiro toque; sem essa checagem ele só polui o console
const vibrar=p=>{try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(p)}catch(e){}};
const fmtNum=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2});
// texto do benefício aplicado: o mesmo pro atendente e pro cliente verem
function textoBenef(tipo,valor){
  if(tipo==='2x1')return 'Pague 1 e leve 2: o prato de menor valor sai de graça';
  if(tipo==='percentual'&&valor!=null)return `${fmtNum(valor)}% de desconto na conta`;
  if(tipo==='valor_fixo'&&valor!=null)return `R$ ${fmtNum(valor)} de desconto na conta`;
  if(tipo==='brinde')return 'Brinde da casa (não abate da conta)';
  return 'Benefício da casa';
}
// espelho do cálculo do servidor, só pra mostrar a prévia enquanto o atendente digita. O número oficial é o que o servidor devolve
function calcularLocal(tipo,valor,conta,item,manual){
  if(conta==null)return ['percentual','valor_fixo','2x1'].includes(tipo)?{erro:'Informe o valor da conta.'}:{desconto:null,pagar:null};
  if(conta<=0)return {erro:'O valor da conta precisa ser maior que zero.'};
  let d=0;
  if(tipo==='2x1'){
    if(item==null||item<=0)return {erro:'Informe o valor do prato de menor preço.'};
    if(item>conta)return {erro:'O prato de menor preço não pode custar mais que a conta.'};
    d=item;
  }else if(tipo==='percentual')d=Math.round(conta*(Number(valor)||0)/100);
  else if(tipo==='valor_fixo')d=Math.round((Number(valor)||0)*100);
  else if(tipo==='outro')d=manual||0;
  d=Math.min(Math.max(d,0),conta);
  return {desconto:d,pagar:conta-d};
}
// resumo do uso: conta, desconto e quanto pagar. Mostrado igual no balcão (quem validou) e no celular do cliente (quem foi validado)
function resumoUsoHtml(u,quem){
  const cli=quem==='cliente';
  return `<div class="resumo"><div class="rs-ben"><b>${esc(u.beneficio)}</b><small>${esc(textoBenef(u.tipo,u.valor_beneficio))}</small></div>
    ${u.conta_centavos!=null?`<div class="kv"><span>Valor da conta</span><b>${brl(u.conta_centavos)}</b></div>
      <div class="kv"><span>Desconto aplicado</span><b style="color:var(--green)">− ${brl(u.desconto_centavos)}</b></div>
      <div class="rs-pagar"><small>${cli?'Você paga':'Cliente paga'}</small><strong>${brl(u.pagar_centavos)}</strong></div>`
    :`<div class="banner info" style="margin:12px 0 0">${ic('alert')}<span>Valor da conta não informado. ${cli?'Confirme o valor final com o atendente.':'Informe o valor final ao cliente.'}</span></div>`}</div>`;
}
const skl=()=>'<div class="skl"></div>';
const vazio=(icone,msg)=>`<div class="empty">${ic(icone)}<p>${msg}</p></div>`;
function copiar(txt){
  const fim=()=>toast('Copiado!','ok');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(fim,()=>toast('Não foi possível copiar.','erro'));return}
  const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
  try{document.execCommand('copy');fim()}catch(e){toast('Não foi possível copiar.','erro')}t.remove();
}
let toastT;
function toast(msg,tipo=''){const t=$('#toast');t.textContent=msg;t.className='show '+tipo;clearTimeout(toastT);toastT=setTimeout(()=>{t.className=''},3400)}
function alternarTema(){
  const t=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;store.set('nvd.tema',t);
  const m=$('meta[name=theme-color]');if(m)m.content=t==='light'?'#f3f5fb':'#0a0f1f';
}

/* ---------- campos de formulário ---------- */
const fld=(id,label,v='',o={})=>`<div class="field"><label for="${id}">${label}</label>${o.area
  ?`<textarea id="${id}" rows="${o.rows||3}" ${o.max?`maxlength="${o.max}"`:''} placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`
  :`<input id="${id}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.max?`maxlength="${o.max}"`:''} ${o.mode?`inputmode="${o.mode}"`:''} ${o.auto?`autocomplete="${o.auto}"`:''} ${o.list?`list="${o.list}"`:''} ${o.req?'required':''} ${o.extra||''}>`}${o.hint?`<small>${o.hint}</small>`:''}</div>`;

/* ---------- API ---------- */
const S={token:null,papel:null,user:null,parceiro:null,config:{},tab:null,cart:null,offline:false};
/* Feita pra rede fraca: cada tentativa tem limite de tempo (sem ficar pendurada), falha de rede tenta de novo sozinha e um aviso
   discreto "Conexão lenta" aparece se demorar. Só repete sozinho o que é seguro repetir (leituras e ações que o servidor protege). */
let emVoo=0,avisoT=null;
const dorme=ms=>new Promise(r=>setTimeout(r,ms));
const REPETIVEL=/^nvd_(sessao|login|logout|planos_publicos|config_publica|membro_(carteirinha|parceiros|historico|pagamentos|atendimento|criar_pagamento|informar_pagamento)|parceiro_(resumo|validar|confirmar_uso|descontos)|admin_(painel|pagamentos|comprovantes|membros|planos|parceiros|usuarios|usos|config|aprovacoes))$/;
async function api(fn,args={},o={}){
  // limite de tempo por tentativa (pode ser uma lista crescente): conexão travada é abandonada cedo e refeita numa conexão nova,
  // mas a última tentativa espera mais, pra resposta grande em rede lenta ter tempo de chegar
  const max=o.tentativas||(REPETIVEL.test(fn)?3:1),lista=[].concat(o.timeout||[10000,15000,25000]);
  let ultimo;
  if(++emVoo===1)avisoT=setTimeout(()=>{const b=$('#netbar');if(b)b.hidden=false},2500);
  try{
    for(let i=1;i<=max;i++){
      if(o.onTentativa)o.onTentativa(i,max);
      const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),lista[Math.min(i-1,lista.length-1)]);
      let res,data=null;
      try{
        res=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args),signal:ctl.signal});
        try{data=await res.json()}catch(e){if(ctl.signal.aborted)throw e}
      }catch(e){
        ultimo=new Error(ctl.signal.aborted?'A conexão está muito lenta.':'Sem conexão com a internet.');ultimo.offline=true;
        if(i<max)await dorme(300*i);
        continue;
      }finally{clearTimeout(t)}
      // 429/502/503/504 = gargalo de rede ou servidor ocupado (passageiro): tenta de novo; nas outras respostas o erro é real e vai pra tela
      if(res.status===429||(res.status>=502&&res.status<=504)){
        ultimo=new Error('O servidor está ocupado. Tente de novo em instantes.');ultimo.offline=true;
        if(i<max){await dorme(500*i);continue}
        break;
      }
      if(!res.ok){
        if(res.status===401&&S.token&&!o.semLogout)sessaoExpirou();
        const err=new Error((data&&data.message)||'Erro inesperado. Tente de novo.');err.status=res.status;throw err;
      }
      if(!o.raw&&data&&data.ok===false){const err=new Error(data.erro||'Não foi possível concluir.');err.dados=data;throw err}
      return data;
    }
    throw ultimo;
  }finally{
    if(--emVoo===0){clearTimeout(avisoT);const b=$('#netbar');if(b)b.hidden=true}
  }
}
const tk=(fn,args={},o)=>api(fn,{p_token:S.token,...args},o);

/* ---------- criptografia da carteirinha (mesma conta do servidor: HMAC-SHA256 por janela de 30 s) ---------- */
const enc=new TextEncoder(),chaves=new Map();
async function hmac(secret,msg){
  if(!(window.crypto&&crypto.subtle))throw new Error('Abra o app por uma conexão segura (https).');
  let k=chaves.get(secret);
  if(!k){k=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);chaves.set(secret,k)}
  return new Uint8Array(await crypto.subtle.sign('HMAC',k,enc.encode(msg)));
}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
async function gerarToken(codigo,secret,janela){
  const a=await hmac(secret,`q|${codigo}|${janela}`),p=await hmac(secret,`p|${codigo}|${janela}`);
  const n=(((p[0]&127)<<24)|(p[1]<<16)|(p[2]<<8)|p[3])%1000000;
  return {qr:`NVD1.${codigo}.${janela}.${hex(a).slice(0,16)}`,pin:String(n).padStart(6,'0')};
}
/* Gerador de QR próprio (modo byte, correção M, versões 1 a 3): sem biblioteca externa, então a carteirinha nunca espera
   download de outro site nem falha sem sinal. O texto da carteirinha tem 39 bytes e cabe na versão 3 (29x29). */
const GF_EXP=new Uint8Array(512),GF_LOG=new Uint8Array(256);
(()=>{let x=1;for(let i=0;i<255;i++){GF_EXP[i]=x;GF_LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)GF_EXP[i]=GF_EXP[i-255]})();
const gfMul=(a,b)=>a&&b?GF_EXP[GF_LOG[a]+GF_LOG[b]]:0;
const QR_V=[null,{dados:16,ec:10},{dados:28,ec:16},{dados:44,ec:26}]; // bloco único, nível M
function rsResto(dados,n){
  let g=[1];
  for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=gfMul(g[j],GF_EXP[i])}g=ng}
  const r=new Array(n).fill(0);
  for(const d of dados){const f=d^r.shift();r.push(0);for(let i=0;i<n;i++)r[i]^=gfMul(g[i+1],f)}
  return r;
}
function qrMatriz(texto,forcaMascara){
  const bytes=[...new TextEncoder().encode(texto)];
  let v=1;while(v<=3&&bytes.length>QR_V[v].dados-2)v++;
  if(v>3)throw new Error('Texto grande demais para o QR');
  const {dados,ec}=QR_V[v],n=17+4*v;
  const bits=[],put=(x,k)=>{for(let i=k-1;i>=0;i--)bits.push((x>>i)&1)};
  put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));put(0,Math.min(4,dados*8-bits.length));
  while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  for(let p=0xec;cw.length<dados;p^=0xec^0x11)cw.push(p);
  const fluxo=[];cw.concat(rsResto(cw,ec)).forEach(b=>{for(let i=7;i>=0;i--)fluxo.push((b>>i)&1)});
  const m=Array.from({length:n},()=>new Array(n).fill(false)),fn=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(r,c,x)=>{if(r>=0&&r<n&&c>=0&&c<n){m[r][c]=x;fn[r][c]=true}};
  const loc=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const dentro=dr>=0&&dr<=6&&dc>=0&&dc<=6;set(r0+dr,c0+dc,dentro&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};
  loc(0,0);loc(0,n-7);loc(n-7,0);
  for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  if(v>=2){const a=n-7;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(a+dr,a+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1)}
  set(n-8,8,true);
  for(let i=0;i<9;i++){fn[8][i]=true;fn[i][8]=true}
  for(let i=0;i<8;i++){fn[8][n-1-i]=true;fn[n-1-i][8]=true}
  let k=0;
  for(let dir=n-1;dir>=1;dir-=2){
    if(dir===6)dir=5;
    for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){
      const x=dir-j,y=((dir+1)&2)===0?n-1-vert:vert;
      if(!fn[y][x]&&k<fluxo.length)m[y][x]=fluxo[k++]===1;
    }
  }
  const cond=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(((x/3)|0)+((y/2)|0))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const montar=mk=>{
    const c=m.map(l=>l.slice());
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&cond[mk](x,y))c[y][x]=!c[y][x];
    let rem=mk;for(let q=0;q<10;q++)rem=(rem<<1)^((rem>>>9)*0x537);
    const fb=((mk<<10)|rem)^0x5412,b=q=>((fb>>q)&1)===1,sf=(x,y,d)=>{c[y][x]=d};
    for(let q=0;q<=5;q++)sf(8,q,b(q));sf(8,7,b(6));sf(8,8,b(7));sf(7,8,b(8));for(let q=9;q<15;q++)sf(14-q,8,b(q));
    for(let q=0;q<8;q++)sf(n-1-q,8,b(q));for(let q=8;q<15;q++)sf(8,n-15+q,b(q));
    sf(8,n-8,true);
    return c;
  };
  // escolhe a máscara de menor penalidade (regras da norma: sequências, blocos 2x2, padrões parecidos com o localizador e equilíbrio claro/escuro)
  const pena=c=>{
    let p=0;
    for(let t=0;t<2;t++)for(let a=0;a<n;a++){
      let s='',corrida=1;
      for(let b=0;b<n;b++){
        const cur=t?c[b][a]:c[a][b];s+=cur?'1':'0';
        if(b>0&&cur===(t?c[b-1][a]:c[a][b-1])){corrida++;if(corrida===5)p+=3;else if(corrida>5)p++}else corrida=1;
      }
      p+=40*((s.match(/(?=00001011101|10111010000)/g)||[]).length);
    }
    for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const q=c[y][x];if(q===c[y][x+1]&&q===c[y+1][x]&&q===c[y+1][x+1])p+=3}
    const escuro=c.reduce((s,l)=>s+l.filter(Boolean).length,0);
    return p+(Math.ceil(Math.abs(escuro*20-n*n*10)/(n*n))-1)*10;
  };
  let melhor=null,pmin=Infinity;
  for(let mk=0;mk<8;mk++){if(forcaMascara!=null&&mk!==forcaMascara)continue;const c=montar(mk),pp=pena(c);if(pp<pmin){pmin=pp;melhor=c}}
  return melhor;
}
function qrSvg(texto){
  const q=qrMatriz(texto),n=q.length,m=3;let d='';
  for(let r=0;r<n;r++){let c=0;while(c<n){if(q[r][c]){const s=c;while(c<n&&q[r][c])c++;d+=`M${s} ${r}h${c-s}v1h-${c-s}z`}else c++}}
  return `<svg viewBox="${-m} ${-m} ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code da carteirinha"><rect x="${-m}" y="${-m}" width="${n+2*m}" height="${n+2*m}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* --- barras horizontais (menu do admin e filtros): seta, roda do mouse e arrastar; no celular o dedo já rola --- */
let arrastou=false;
document.addEventListener('wheel',e=>{
  const el=e.target.closest&&e.target.closest('.atabs,.fchips');
  if(!el||el.scrollWidth<=el.clientWidth||Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  el.scrollLeft+=e.deltaY;e.preventDefault();
},{passive:false});
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.atabs,.fchips');
  if(!el||e.pointerType!=='mouse'||e.button!==0||el.scrollWidth<=el.clientWidth)return;
  const x0=e.clientX,s0=el.scrollLeft;let moveu=false;

async function carregarCart(){
  const token=S.token,t0=Date.now(),r=await tk('nvd_membro_carteirinha');
  if(S.token!==token)return; // rede lenta: a resposta chegou depois de sair/trocar de conta, não pode aparecer pra outra pessoa
  // offset entre o relógio do aparelho e o do servidor: o QR usa a hora do servidor, então relógio errado não quebra
  S.cart={...r,offsetMs:r.agora_ms-(t0+Date.now())/2};S.cartEm=Date.now();
  store.set('nvd.cart',JSON.stringify(S.cart));
}
const cartAtiva=c=>!!(c&&!c.bloqueado&&c.valido_ate&&new Date(c.valido_ate).getTime()>Date.now()+c.offsetMs);

function pararQr(){if(S.qrTimer){clearInterval(S.qrTimer);S.qrTimer=null}S.qrWin=null}
function iniciarQr(){
  pararQr();S.tickN=0;S.atN=0;
  const tick=async()=>{
    const c=S.cart;if(!c)return;
    if(!cartAtiva(c)){pararQr();return desenharCart()}
    const agora=(Date.now()+c.offsetMs)/1000,win=Math.floor(agora/30);
    if(win!==S.qrWin){
      S.qrWin=win;
      try{
        const t=await gerarToken(c.codigo,c.qr_secret,win);
        if(S.qrWin!==win||!$('#qr'))return;
        $('#qr').innerHTML=qrSvg(t.qr);
        $('#pin').textContent=t.pin.slice(0,3)+' '+t.pin.slice(3);
      }catch(e){if($('#qr'))$('#qr').innerHTML=`<div class="qr-off">${esc(e.message)}</div>`}
    }
    const b=$('#tbar');if(b)b.style.transform='scaleX('+((30-(agora%30))/30)+')';
    // com pagamento pendente, confere a cada ~20 s se o admin já confirmou
    if(c.pendente&&++S.tickN%20===0&&!S.offline)carregarCart().then(()=>{if(S.tab==='cart'&&cartAtiva(S.cart)!==cartAtiva(c))desenharCart()}).catch(()=>{});
    // a cada ~3 s pergunta se o atendente já validou/confirmou: o resumo aparece no celular sem o cliente tocar em nada.
    // Sem sinal, tenta só a cada ~15 s; quando a resposta volta, o aviso de "sem conexão" some sozinho
    if(++S.atN%(S.offline?15:3)===0)verAtendimento();
  };
  tick();S.qrTimer=setInterval(tick,1000);
}

const FN_COMPROVANTE=SB_URL+'/functions/v1/nvd-comprovante';
const COMP_MAX=5*1024*1024;
const tamTxt=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round((b||0)/1024))+' KB';

// upload por XHR (e não fetch) só pra mostrar o progresso: no 4G do restaurante o envio de uma foto demora
function enviarArquivo(url,fd,onProg){
  return new Promise((ok,falha)=>{
    const x=new XMLHttpRequest();x.open('POST',url);x.setRequestHeader('apikey',SB_KEY);x.timeout=90000;
    x.upload.onprogress=e=>{if(e.lengthComputable)onProg(Math.round(e.loaded/e.total*100))};
    x.onload=()=>{let d=null;try{d=JSON.parse(x.responseText)}catch(e){}ok({status:x.status,dados:d})};
    x.onerror=()=>falha(new Error('Sem conexão com a internet.'));
    x.ontimeout=()=>falha(new Error('O envio demorou demais. Confira a internet e tente de novo.'));
    x.send(fd);
  });
}
// chamadas JSON da mesma Edge Function (ver comprovante, excluir membro com os arquivos)
async function fnComprovante(body){
  let res;
  try{res=await fetch(FN_COMPROVANTE,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,...body})})}
  catch(e){throw new Error('Sem conexão com a internet.')}
  let d=null;try{d=await res.json()}catch(e){}
  if(res.status===401)sessaoExpirou();
  if(!res.ok||!d||d.ok!==true)throw new Error((d&&d.erro)||'Erro inesperado. Tente de novo.');
  return d;
}
function comprimirImagem(f){
  return new Promise(async(ok,falha)=>{
    const t=setTimeout(()=>falha(new Error('tempo esgotado')),8000);
    try{
      const bmp=await createImageBitmap(f),fator=Math.min(1,1800/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*fator);cv.height=Math.round(bmp.height*fator);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
      cv.toBlob(b=>{clearTimeout(t);b?ok(b):falha(new Error('sem blob'))},'image/jpeg',0.85);
    }catch(e){clearTimeout(t);falha(e)}
  });
}
async function prepararArquivo(f){
  const nome=f.name||'comprovante',tipo=(f.type||'').toLowerCase();
  if(tipo==='application/pdf'||/\.pdf$/i.test(nome)){
    if(f.size>COMP_MAX)throw new Error('O PDF passa de 5 MB. Envie um arquivo menor.');
    return f;
  }
  if(!(/^image\//.test(tipo)||/\.(jpe?g|png|webp|heic|heif)$/i.test(nome)))throw new Error('Envie uma imagem (JPG ou PNG) ou um PDF.');
  const direto=/^image\/(jpeg|png|webp)$/.test(tipo);
  if(direto&&f.size<=1.5*1048576)return f;
  // foto grande (ou HEIC do iPhone) é reduzida e vira JPEG aqui: sobe mais rápido e o admin abre em qualquer navegador
  try{return new File([await comprimirImagem(f)],nome.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}
  catch(e){
    if(direto&&f.size<=COMP_MAX)return f;
    throw new Error('Não deu pra ler essa imagem. Tente enviar em JPG, PNG ou PDF.');
  }
}

document.addEventListener('change',async e=>{
  if(e.target.id!=='fComp')return;
  const f=e.target.files&&e.target.files[0];e.target.value=''; // limpa pra poder escolher o mesmo arquivo de novo
  if(!f)return;
  const area=$('#compArea');
  if(area)area.innerHTML='<div class="filebox"><span class="spin"></span><div class="grow"><small>Preparando o arquivo…</small></div></div>';
  limparPrevia();
  try{
    S.compArq=await prepararArquivo(f);
    if(/^image\//.test(S.compArq.type))S.compUrl=URL.createObjectURL(S.compArq);
  }catch(err){toast(err.message,'erro')}
  desenharEscolha();
});
acoes['comp-enviar']=async el=>{
  const f=S.compArq;if(!f)return toast('Escolha o arquivo do comprovante.','erro');
  if(f.size>COMP_MAX)return toast('O arquivo passa de 5 MB.','erro');
  const fd=new FormData();fd.append('token',S.token);fd.append('pagamento_id',el.dataset.id);fd.append('arquivo',f,f.name);
  const rotulo=el.innerHTML,prog=n=>{el.innerHTML=`<span class="spin"></span> Enviando… ${n}%`};
  el.disabled=true;prog(0);
  try{
    const {status,dados}=await enviarArquivo(FN_COMPROVANTE,fd,prog);
    if(status===401){sessaoExpirou();return}
    if(!dados||dados.ok!==true)throw new Error((dados&&dados.erro)||'Não foi possível enviar. Tente de novo.');
    toast('Comprovante enviado! Vamos conferir o pagamento.','ok');
    tabsMembro.pagtos();
    carregarCart().catch(()=>{});
  }catch(e){el.disabled=false;el.innerHTML=rotulo;throw e}
};

/* --- distância até o parceiro (mapa "estilo Google Maps") --- */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(km){return km<1?`${Math.round(km*1000)} m`:`${km.toFixed(km<10?1:0).replace('.',',')} km`}
function distanciaDe(p){
  if(!S.geo||S.geo==='negado'||p.latitude==null||p.longitude==null)return null;
  return haversineKm(S.geo.lat,S.geo.lon,p.latitude,p.longitude);
}
function pedirGeo(){
  return new Promise(resolve=>{
    if(!('geolocation'in navigator)){S.geo='negado';return resolve(null)}
    navigator.geolocation.getCurrentPosition(
      pos=>{S.geo={lat:pos.coords.latitude,lon:pos.coords.longitude};resolve(S.geo)},
      ()=>{S.geo='negado';resolve(null)},
      {enableHighAccuracy:false,timeout:8000,maximumAge:120000}
    );
  });
}
acoes['pedir-geo']=async()=>{S.geo=null;await pedirGeo();if(S.pf.view==='mapa')mostrarMapaParceiros();else listaParceiros()};

/* --- carrega o Leaflet só quando o cliente abre a aba Mapa (mesma lógica de carregamento
   sob demanda do leitor de QR: não pesa no carregamento inicial do app) --- */
let leafletP=null;
function carregarLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((ok,falha)=>{
    if(!document.getElementById('leaflet-css')){
      const l=document.createElement('link');
      l.id='leaflet-css';l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
      l.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';l.crossOrigin='anonymous';
      document.head.appendChild(l);
    }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    s.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';s.crossOrigin='anonymous';
    s.onload=()=>window.L?ok():falha(new Error('Leaflet'));s.onerror=()=>{s.remove();falha(new Error('Leaflet'))};
    document.head.appendChild(s);
  }).catch(e=>{leafletP=null;throw e});
  return leafletP;
}
function pinNvd(cor){return window.L.divIcon({className:'',html:`<div class="nvd-pin ${cor||''}"><span>${cor==='me'?'●':'♞'}</span></div>`,iconSize:[34,34],iconAnchor:[17,30],popupAnchor:[0,-28]})}
let mapaParceiros=null,marcadoresParceiros={};
async function mostrarMapaParceiros(){
  const wrap=$('#pmapa');if(!wrap)return;
  wrap.innerHTML='<div class="skl" style="height:100%"></div>';
  try{await carregarLeaflet()}catch(e){wrap.innerHTML='';return erroView(wrap,{message:'Não foi possível carregar o mapa. Verifique sua internet.'})}
  if(S.pf.view!=='mapa'||!$('#pmapa'))return; // saiu da aba mapa enquanto carregava
  if(S.geo===null)await pedirGeo();
  const banner=$('#pgeo-banner');
  if(banner)banner.innerHTML=S.geo==='negado'
    ?`<button type="button" class="banner warn" data-act="pedir-geo">${ic('pin')} Ative sua localização pra ver a distância até cada parceiro</button>`:'';
  wrap.innerHTML='';
  const L=window.L;
  const map=L.map(wrap,{zoomControl:true}).setView([-19.9167,-43.9345],12);
  mapaParceiros=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const pontos=[];marcadoresParceiros={};
  const lista=parceirosFiltrados().filter(p=>p.latitude!=null&&p.longitude!=null);
  lista.forEach(p=>{
    const mk=L.marker([p.latitude,p.longitude],{icon:pinNvd()}).addTo(map);
    const d=distanciaDe(p);
    mk.bindPopup(`<div style="min-width:180px"><b>${esc(p.nome)}</b><br><span style="color:var(--muted)">${esc(p.categoria)}${p.endereco?' · '+esc(p.endereco):''}</span>${d!=null?`<br><span style="color:var(--blue);font-weight:700">${fmtDist(d)}</span>`:''}<br><button type="button" class="btn sm" style="margin-top:8px" data-act="parceiro" data-id="${esc(p.id)}">Ver detalhes</button></div>`);
    marcadoresParceiros[p.id]=mk;
    pontos.push([p.latitude,p.longitude]);
  });
  if(S.geo&&S.geo!=='negado'){
    L.marker([S.geo.lat,S.geo.lon],{icon:pinNvd('me')}).addTo(map).bindPopup('Você está aqui');
    pontos.push([S.geo.lat,S.geo.lon]);
  }
  if(pontos.length>1)map.fitBounds(pontos,{padding:[36,36]});
  else if(pontos.length===1)map.setView(pontos[0],15);
  // lista abaixo do mapa, ordenada por distância (igual Google Maps) — some se não tiver geolocalização
  const comDist=lista.map(p=>({p,d:distanciaDe(p)}));
  if(S.geo&&S.geo!=='negado')comDist.sort((a,b)=>(a.d??Infinity)-(b.d??Infinity));
  const ML=$('#pmlist');
  if(ML)ML.innerHTML=comDist.length?comDist.map(({p,d})=>`<button type="button" class="row" data-act="pmarker" data-id="${esc(p.id)}">
      <div class="logo">${ic('pin')}</div>
      <div class="grow"><b>${esc(p.nome)}</b><small>${esc(p.endereco||p.categoria)}</small></div>
      ${d!=null?`<span class="chip dist-chip">${fmtDist(d)}</span>`:''}</button>`).join('')
    :vazio('pin','Nenhum parceiro com localização cadastrada ainda.');
}
acoes.pmarker=el=>{
  const mk=marcadoresParceiros[el.dataset.id];
  if(mk&&mapaParceiros){mapaParceiros.setView(mk.getLatLng(),16);mk.openPopup()}
};

const TEMPO_BALCAO=[8000,12000,20000,25000];

    S.val=r;desenharResultado(r);

/* --- leitor de QR pela câmera --- */
let scanEstado=null;
let jsqrP=null;
function carregarJsQR(){
  if(window.jsQR)return Promise.resolve();
  if(jsqrP)return jsqrP; // o pré-carregamento e o botão de escanear não baixam duas vezes
  jsqrP=new Promise((ok,falha)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.integrity='sha256-vEDIoVGWI2sjFNsIVvcsoLSZgM1UE7jIUqc0n1/uCFk=';s.crossOrigin='anonymous';
    s.onload=()=>window.jsQR?ok():falha(new Error('jsQR'));s.onerror=()=>{s.remove();falha(new Error('jsQR'))};
    document.head.appendChild(s);
  }).catch(e=>{jsqrP=null;throw e});
  return jsqrP;
}
function fecharScanner(){
  if(scanEstado){clearInterval(scanEstado.timer);scanEstado.stream.getTracks().forEach(t=>t.stop());scanEstado=null}
  $$('.scan').forEach(e=>e.remove());document.body.classList.remove('noscroll');
}
acoes['fechar-scan']=()=>fecharScanner();
acoes.scan=async()=>{
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return toast('Este navegador não abre a câmera. Digite o código e o PIN.','erro');
  const el=document.createElement('div');el.className='scan';
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"><i></i></div><div class="bar"><b>Escaneie o QR da carteirinha</b><button type="button" class="ib" data-act="fechar-scan" aria-label="Fechar">${ic('x')}</button></div><div class="msg" id="scanMsg">Aponte a câmera para o QR code</div>`;
  document.body.appendChild(el);document.body.classList.add('noscroll');
  const video=el.querySelector('video');let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){fecharScanner();return toast(e&&e.name==='NotAllowedError'?'Permita o uso da câmera para escanear.':'Não foi possível abrir a câmera.','erro')}
  if(!$('.scan')){stream.getTracks().forEach(t=>t.stop());return}
  video.srcObject=stream;try{await video.play()}catch(e){}
  let det=null;
  try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  // iPhone/Safari e Firefox não têm BarcodeDetector: cai pro jsQR, carregado só quando precisa
  if(!det){try{await carregarJsQR()}catch(e){fecharScanner();return toast('Não foi possível carregar o leitor. Digite o código e o PIN.','erro')}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  scanEstado={stream,busy:false,timer:null};
  const est=scanEstado;
  est.timer=setInterval(async()=>{
    if(est.busy||video.readyState<2||!video.videoWidth)return;
    est.busy=true;
    try{
      let txt=null;
      if(det){const r=await det.detect(video);if(r.length)txt=r[0].rawValue}
      else{
        const w=Math.min(video.videoWidth,720),h=Math.round(w*video.videoHeight/video.videoWidth);
        cv.width=w;cv.height=h;cx.drawImage(video,0,0,w,h);
        const d=cx.getImageData(0,0,w,h),r=window.jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});if(r)txt=r.data;
      }
      if(txt&&/^NVD1\./.test(txt)){fecharScanner();validar({p_qr:txt});return}
      if(txt){const m=$('#scanMsg');if(m)m.textContent='Esse QR não é de uma carteirinha NVD CARD.'}
    }catch(e){}
    est.busy=false;
  },220);
};

function detalhesPg(g){
  const l=[];
  if(g.status==='cancelado')l.push(`Cancelado ${g.cancelado_por==='admin'?'pelo administrador':g.cancelado_por==='cliente'?'pelo cliente':''}${g.cancelado_em?' em '+esc(dth(g.cancelado_em)):''}${g.cancelado_motivo?': “'+esc(g.cancelado_motivo)+'”':''}`);
  if(g.status==='pendente'&&g.comprovante_recusa_motivo)l.push(`<span style="color:var(--red)">Comprovante recusado: ${esc(g.comprovante_recusa_motivo)}. Aguardando novo envio.</span>`);
  if(g.estorno_status==='solicitado')l.push(`<span style="color:var(--blue)"><b style="display:inline">Estorno solicitado</b> ${esc(ha(g.estorno_solicitado_em))}: “${esc(g.estorno_motivo||'')}”</span>`);
  if(g.estorno_status==='recusado')l.push(`Estorno recusado${g.estorno_resposta?': “'+esc(g.estorno_resposta)+'”':''}`);
  if(g.status==='devolvido')l.push(`Devolvido <b style="display:inline">${brl(g.devolvido_valor_centavos)}</b> em ${esc(dth(g.devolvido_em))}${g.devolucao_removeu_dias?' · dias removidos da carteirinha':''}${g.devolucao_obs?' · “'+esc(g.devolucao_obs)+'”':''}`);
  if(g.status==='devolvido'&&g.devolucao_comprovante_nome)l.push(`<span style="color:var(--green)">${ic('paperclip','sm')} Comprovante da devolução anexado</span>`);
  return l.map(t=>`<small>${t}</small>`).join('');
}
// botões de ação conforme o estado do pagamento (mesmos na lista e no visualizador)
function botoesPg(g){
  const b=[],id=esc(g.id);
  if(g.status==='pendente'){
    b.push(`<button type="button" class="btn ok sm fit" data-act="pag-confirmar" data-id="${id}">${ic('check')} Confirmar recebimento</button>`);
    if(g.comprovante_nome&&!g.comprovante_recusa_motivo)b.push(`<button type="button" class="btn sec sm" data-act="comp-recusar" data-id="${id}">Pedir outro comprovante</button>`);
    b.push(`<button type="button" class="btn danger sm" data-act="pag-cancelar" data-id="${id}">Cancelar</button>`);
  }
  if(g.status==='pago'||g.estorno_status==='solicitado')b.push(`<button type="button" class="btn ${g.estorno_status==='solicitado'?'ok':'sec'} sm" data-act="pag-devolver" data-id="${id}">${ic('refresh')} Devolver</button>`);
  if(g.estorno_status==='solicitado')b.push(`<button type="button" class="btn danger sm" data-act="est-recusar" data-id="${id}">Recusar estorno</button>`);
  if(g.status==='devolvido'){
    if(g.devolucao_comprovante_nome)b.push(`<button type="button" class="btn sec sm" data-act="dev-ver" data-id="${id}">${ic('eye')} Ver comprovante da devolução</button>`);
    b.push(`<button type="button" class="btn sec sm" data-act="dev-anexar" data-id="${id}">${ic('upload')} ${g.devolucao_comprovante_nome?'Trocar':'Anexar'} comprovante da devolução</button>`);
  }
  return b.join('');
}

const TIPOS_ARQ=['image/jpeg','image/png','image/webp','application/pdf'];
const EXT_ARQ={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'};
function limparArquivos(){S.arq.forEach(o=>{if(o.viaBlob)URL.revokeObjectURL(o.blobUrl)});S.arq.clear()}
// baixa o arquivo uma vez e serve de um blob local: ver, abrir e baixar funcionam mesmo depois do link temporário (2 min) expirar
async function arquivoComprovante(id,qual='pagamento'){
  const chave=qual+':'+id;
  if(S.arq.has(chave))return S.arq.get(chave);
  const r=await fnComprovante({acao:qual==='devolucao'?'ver_devolucao':'ver',pagamento_id:id});
  // só tipos da lista branca viram blob: um tipo inesperado (ex.: text/html) executaria script na origem do app
  if(!TIPOS_ARQ.includes(r.tipo))throw new Error('Tipo de arquivo não suportado.');
  let blobUrl=r.url,viaBlob=false;
  try{const resp=await fetch(r.url);if(resp.ok){blobUrl=URL.createObjectURL(new Blob([await resp.arrayBuffer()],{type:r.tipo}));viaBlob=true}}catch(e){}
  const o={...r,blobUrl,viaBlob};S.arq.set(chave,o);return o;
}
function viewerHtml(g,a){

    ${img?`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Comprovante de pagamento" referrerpolicy="no-referrer"></a>`
      :pdfInline?`<iframe class="pdf" src="${u}" title="Comprovante em PDF"></iframe>`
      :`<div class="filebox"><div class="th">${ic('file')}</div><div class="grow"><b>Comprovante em PDF</b><small>Este navegador não mostra PDF aqui. Use Baixar ou Abrir.</small></div></div>`}

S.apFiltro='pendentes';S.ap=new Map();
const ST_AP={pendente:['warn','Pendente'],aprovada:['ok','Aprovada'],recusada:['bad','Recusada']};
const CAMPOS_DC=[['titulo','Desconto'],['tipo','Tipo'],['valor','Valor'],['limite','Limite por cliente'],['regras','Regras']];
function valorCampoDc(d,k){
  if(k==='tipo')return (TIPOS_BENEF.find(t=>t[0]===d.tipo)||[])[1]||d.tipo;
  if(k==='valor')return d.valor==null?'—':d.tipo==='percentual'?fmtNum(d.valor)+'%':'R$ '+fmtNum(d.valor);
  if(k==='limite')return `${d.limite_qtd} ${LIMITE_TXT[d.limite_periodo]}`;
  return d[k]||'—';
}
// alteração de desconto no ar: destaca o que muda e risca o valor atual
function diffDc(novo,atual){
  return CAMPOS_DC.map(([k,t])=>{
    const n=valorCampoDc(novo,k),a=atual?valorCampoDc(atual,k):null,mudou=!!atual&&n!==a;
    return `<div class="kv" ${mudou?'style="background:rgba(233,185,91,.12);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px"':''}><span>${t}</span><b>${mudou?`<s style="color:var(--muted2);font-weight:500">${esc(a)}</s> → ${esc(n)}`:esc(n)}</b></div>`;
  }).join('');
}

/* ---------- inicialização ---------- */
// o app guarda uma cópia de si mesmo; quando há versão nova, avisa e o usuário escolhe o momento de atualizar
function avisoAtualizacao(){
  if($('#updbar'))return;
  const b=document.createElement('div');b.id='updbar';
  b.innerHTML='<span>Nova versão do app disponível.</span><button type="button" class="btn sm" data-act="atualizar-app">Atualizar</button>';
  document.body.appendChild(b);
}
acoes['atualizar-app']=()=>location.reload();
// o service worker grava a hora em que achou uma versão mais nova que a aberta; se for depois de esta página abrir, o código daqui está velho
async function verificarAtualizacao(){
  try{
    const m=await caches.match(new URL('__novo',location.href).href);
    if(m&&Number(await m.text())>performance.timeOrigin)avisoAtualizacao();
  }catch(e){}
}
// já entrou neste aparelho: a tela abre na hora com o que está guardado e a sessão é conferida em segundo plano
async function revalidarSessao(){
  const token=S.token;
  try{
    const r=await tk('nvd_sessao',{},{semLogout:true,tentativas:2});
    if(S.token!==token)return; // rede lenta: a resposta chegou depois de sair/entrar com outra conta, não vale mais
    store.set('nvd.perfil',JSON.stringify(r));
    const mudou=r.usuario.papel!==S.papel;aplicarPerfil(r);if(mudou)entrar();
  }catch(e){
    if(S.token!==token)return;
    if(e.status===401){limparSessao();renderAuth('Sua sessão expirou. Entre novamente.')}
    else S.offline=true; // sem rede estável: segue com o que já tem
  }
}
async function boot(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.tipo==='nova-versao')avisoAtualizacao()});
    setTimeout(verificarAtualizacao,2500); // a versão nova pode ter sido achada antes de a página começar a ouvir a mensagem
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)verificarAtualizacao()});
  }
  let sv=null;try{sv=JSON.parse(store.get('nvd.sessao')||'null')}catch(e){}
  if(!sv||!sv.token)return renderAuth();
  S.token=sv.token;
  let p=null;try{p=JSON.parse(store.get('nvd.perfil')||'null')}catch(_){}
  if(p&&p.usuario){aplicarPerfil(p);entrar();revalidarSessao();return}
  try{
    const r=await tk('nvd_sessao',{},{semLogout:true});
    aplicarPerfil(r);store.set('nvd.perfil',JSON.stringify(r));entrar();
  }catch(e){
    if(e.offline)return renderAuth('Sem conexão estável. Tente de novo em instantes.');
    limparSessao();renderAuth(e.status===401?'Sua sessão expirou. Entre novamente.':e.message);
  }
}
// o script fica no fim do corpo: não precisa esperar nenhum evento (e nada externo trava a abertura)
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
